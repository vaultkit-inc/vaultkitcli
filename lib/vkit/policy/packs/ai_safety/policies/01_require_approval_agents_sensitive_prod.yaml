id: ai_require_approval_agents_sensitive_prod
description: Agents need security approval for personal or financial data in production.
priority: 1200

match:
  fields:
    contains: [pii, financial]

context:
  environment: production
  requester_role: agent

action:
  require_approval: true
  approver_role: security
  reason: Agents reading personal or financial data in production need security review.
  ttl: 1h
