id: ai_require_approval_agents_sensitive_prod
description: Agents need security approval for personal data in production. Financial data is 04_require_approval_agents_financial_prod.
priority: 1200

match:
  fields:
    contains: [pii]

context:
  environment: production
  requester_role: agent

action:
  require_approval: true
  approver_role: security
  reason: Agents reading personal data in production need security review.
  ttl: 1h
