id: flag_unknown_sensitivity
description: Allow people to read columns nobody has reviewed yet, and record why, so they show up in the audit log. Agents get them masked (mask_unknown_for_agents).
priority: 20

match:
  fields:
    sensitivity: unknown

action:
  allow: true
  reason: This column's sensitivity is unknown. Review its label in datasets/registry.yaml.
  ttl: 1h
